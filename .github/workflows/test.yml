name: test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: npm test
        env:
          JADE_TEST_HANDLES: 1
          JADE_TEST_STALL_MIN: 3
          # Windows with Node 24 only: end each file's process when its tests are done, to see what else fails once a hang is out of the way
          JADE_TEST_FORCE_EXIT: ${{ matrix.os == 'windows-latest' && matrix.node == 24 && '1' || '' }}
      - name: Gates
        run: npm run gates
